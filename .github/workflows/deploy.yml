name: CI/CD ISI BURGER

on:
  push:
    branches:
      - lo_mbenda_burger
  pull_request:
    branches:
      - lo_mbenda_burger

jobs:

  # ─── JOB 1 : Tests & Build ───────────────────────────
  build:
    name: Install & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: laravel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Pull du code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_pgsql, gd, zip
          coverage: none

      - name: Installation des dépendances Laravel
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copie du fichier .env
        run: cp .env.example .env

      - name: Génération de la clé app
        run: php artisan key:generate

      - name: Configuration base de données test
        run: |
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=laravel_test" >> .env
          echo "DB_USERNAME=laravel" >> .env
          echo "DB_PASSWORD=laravel" >> .env

      - name: Migration base de données
        run: php artisan migrate --force

      - name: Seed base de données
        run: php artisan db:seed --force

      - name: Installation des dépendances Node
        run: npm ci

      - name: Build frontend
        run: npm run build

  # ─── JOB 2 : Docker Image ────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Pull du code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build et Push image Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/isi-burger:latest
            ${{ secrets.DOCKER_USERNAME }}/isi-burger:${{ github.sha }}
